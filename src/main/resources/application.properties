spring.application.name=oficina_api

# Banco de dados H2 (gravado em arquivo, dentro da pasta DATA do projeto)
spring.datasource.url=jdbc:h2:file:./DATA/oficina
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# O esquema do banco e criado/versionado pelo Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none

# Mostrar os comandos SQL no log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
